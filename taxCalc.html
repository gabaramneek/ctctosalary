<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Income Tax Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>Income Tax Calculator</h1>
    <p>Estimate your income tax liability for financial year 2025-26.</p>
    <form>
      <div class="mb-3">
        <label for="incomeInput" class="form-label">Enter Your Taxable Income (₹):</label>
        <input type="number" class="form-control" id="incomeInput" placeholder="e.g. 1200000" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate Tax</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    // Simplified tax slab example (2025-26)
    function calculateTax(income) {
      let tax = 0;
      if (income <= 250000) {
        tax = 0;
      } else if (income <= 500000) {
        tax = (income - 250000) * 0.05;
      } else if (income <= 1000000) {
        tax = (250000 * 0.05) + (income - 500000) * 0.2;
      } else {
        tax = (250000 * 0.05) + (500000 * 0.2) + (income - 1000000) * 0.3;
      }
      return tax;
    }

    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const income = parseFloat(document.getElementById('incomeInput').value);
      if (isNaN(income) || income <= 0) {
        alert('Please enter a valid positive number for income.');
        return;
      }
      const tax = calculateTax(income).toFixed(2);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>Estimated Income Tax</h2>
        <p>Your estimated tax liability is <strong>₹${tax}</strong>.</p>
      `;
    });
  </script>
</body>
</html>
