<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salary Calculator for Employers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>Salary Calculator for Employers</h1>
    <p>Calculate the total salary expense and breakdown for your employees.</p>
    <form>
      <div class="mb-3">
        <label for="grossSalaryInput" class="form-label">Enter Gross Salary (₹):</label>
        <input type="number" class="form-control" id="grossSalaryInput" placeholder="e.g. 1500000" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const grossSalary = parseFloat(document.getElementById('grossSalaryInput').value);
      if (isNaN(grossSalary) || grossSalary <= 0) {
        alert('Please enter a valid positive number for Gross Salary.');
        return;
      }
      const employerPF = (grossSalary * 0.12).toFixed(2);
      const gratuity = (grossSalary * 0.0481).toFixed(2);
      const totalCost = (grossSalary + parseFloat(employerPF) + parseFloat(gratuity)).toFixed(2);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>Employer Cost Breakdown</h2>
        <table class="table table-bordered table-striped">
          <tbody>
            <tr><th>Gross Salary</th><td>₹${grossSalary.toFixed(2)}</td></tr>
            <tr><th>Employer PF Contribution (12%)</th><td>₹${employerPF}</td></tr>
            <tr><th>Gratuity (4.81%)</th><td>₹${gratuity}</td></tr>
            <tr><th>Total Cost to Company (CTC)</th><td>₹${totalCost}</td></tr>
          </tbody>
        </table>
      `;
    });
  </script>
</body>
</html>
