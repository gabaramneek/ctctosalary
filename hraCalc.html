<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRA Exemption Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>HRA Exemption Calculator</h1>
    <p>Calculate the tax exemption on your House Rent Allowance.</p>
    <form>
      <div class="mb-3">
        <label for="basicSalaryInput" class="form-label">Basic Salary (₹):</label>
        <input type="number" class="form-control" id="basicSalaryInput" placeholder="e.g. 50000" required />
      </div>
      <div class="mb-3">
        <label for="hraReceivedInput" class="form-label">HRA Received (₹):</label>
        <input type="number" class="form-control" id="hraReceivedInput" placeholder="e.g. 20000" required />
      </div>
      <div class="mb-3">
        <label for="rentPaidInput" class="form-label">Rent Paid (₹):</label>
        <input type="number" class="form-control" id="rentPaidInput" placeholder="e.g. 22000" required />
      </div>
      <div class="mb-3">
        <label for="cityType" class="form-label">City Type:</label>
        <select class="form-select" id="cityType" required>
          <option value="">Select city type</option>
          <option value="metro">Metro</option>
          <option value="non-metro">Non-Metro</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Calculate Exemption</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const basic = parseFloat(document.getElementById('basicSalaryInput').value);
      const hraReceived = parseFloat(document.getElementById('hraReceivedInput').value);
      const rentPaid = parseFloat(document.getElementById('rentPaidInput').value);
      const cityType = document.getElementById('cityType').value;

      if ([basic, hraReceived, rentPaid].some(v => isNaN(v) || v <= 0) || !cityType) {
        alert('Please enter valid positive numbers and select city type.');
        return;
      }

      const rentMinus10PercentBasic = rentPaid - (basic * 0.1);
      const rentMinus10PercentBasicPositive = rentMinus10PercentBasic > 0 ? rentMinus10PercentBasic : 0;
      const percentageOfBasic = cityType === 'metro' ? basic * 0.5 : basic * 0.4;

      const exemption = Math.min(hraReceived, rentMinus10PercentBasicPositive, percentageOfBasic);
      const taxableHRA = hraReceived - exemption;

      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>HRA Exemption Result</h2>
        <p>Exempted HRA: <strong>₹${exemption.toFixed(2)}</strong></p>
        <p>Taxable HRA: <strong>₹${taxableHRA.toFixed(2)}</strong></p>
      `;
    });
  </script>
</body>
</html>
