<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pension Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>Pension Calculator</h1>
    <p>Estimate your monthly pension based on your last drawn salary and years of service.</p>
    <form>
      <div class="mb-3">
        <label for="lastSalaryInput" class="form-label">Last Drawn Salary (₹):</label>
        <input type="number" class="form-control" id="lastSalaryInput" placeholder="e.g. 70000" required />
      </div>
      <div class="mb-3">
        <label for="serviceYearsInput" class="form-label">Years of Service:</label>
        <input type="number" class="form-control" id="serviceYearsInput" placeholder="e.g. 25" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate Pension</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const lastSalary = parseFloat(document.getElementById('lastSalaryInput').value);
      const years = parseInt(document.getElementById('serviceYearsInput').value);
      if (isNaN(lastSalary) || lastSalary <= 0 || isNaN(years) || years <= 0) {
        alert('Please enter valid positive numbers for salary and years.');
        return;
      }
      const pension = ((lastSalary * years) / 70).toFixed(2); // Pension formula approximation
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>Estimated Monthly Pension</h2>
        <p>Your estimated monthly pension is <strong>₹${pension}</strong>.</p>
      `;
    });
  </script>
</body>
</html>
