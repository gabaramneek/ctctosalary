<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salary Calculator for Employees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>Salary Calculator for Employees</h1>
    <p>Use this calculator to break down your CTC and understand your salary components.</p>
    <form>
      <div class="mb-3">
        <label for="ctcInput" class="form-label">Enter your CTC (₹):</label>
        <input type="number" class="form-control" id="ctcInput" placeholder="e.g. 1000000" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const ctc = parseFloat(document.getElementById('ctcInput').value);
      if (isNaN(ctc) || ctc <= 0) {
        alert('Please enter a valid positive number for CTC.');
        return;
      }
      const basic = (ctc * 0.4).toFixed(2);
      const hra = (ctc * 0.2).toFixed(2);
      const pf = (ctc * 0.12).toFixed(2);
      const tax = (ctc * 0.1).toFixed(2);
      const other = (ctc - basic - hra - pf - tax).toFixed(2);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>Salary Breakdown</h2>
        <table class="table table-bordered table-striped">
          <tbody>
            <tr><th>Basic Salary</th><td>₹${basic}</td></tr>
            <tr><th>House Rent Allowance (HRA)</th><td>₹${hra}</td></tr>
            <tr><th>Provident Fund (PF)</th><td>₹${pf}</td></tr>
            <tr><th>Income Tax</th><td>₹${tax}</td></tr>
            <tr><th>Other Components</th><td>₹${other}</td></tr>
          </tbody>
        </table>
      `;
    });
  </script>
</body>
</html>
