<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>EMI Calculator</h1>
    <p>Calculate your monthly EMI for a loan based on principal, interest rate, and tenure.</p>
    <form>
      <div class="mb-3">
        <label for="principalInput" class="form-label">Loan Amount (₹):</label>
        <input type="number" class="form-control" id="principalInput" placeholder="e.g. 1000000" required />
      </div>
      <div class="mb-3">
        <label for="interestInput" class="form-label">Annual Interest Rate (%):</label>
        <input type="number" step="0.01" class="form-control" id="interestInput" placeholder="e.g. 7.5" required />
      </div>
      <div class="mb-3">
        <label for="tenureInput" class="form-label">Loan Tenure (Years):</label>
        <input type="number" class="form-control" id="tenureInput" placeholder="e.g. 15" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate EMI</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const principal = parseFloat(document.getElementById('principalInput').value);
      const annualInterest = parseFloat(document.getElementById('interestInput').value);
      const tenureYears = parseInt(document.getElementById('tenureInput').value);
      if (isNaN(principal) || principal <= 0 || isNaN(annualInterest) || annualInterest <= 0 || isNaN(tenureYears) || tenureYears <= 0) {
        alert('Please enter valid positive numbers for all fields.');
        return;
      }
      const monthlyInterest = annualInterest / 12 / 100;
      const tenureMonths = tenureYears * 12;
      const emi = ((principal * monthlyInterest * Math.pow(1 + monthlyInterest, tenureMonths)) / (Math.pow(1 + monthlyInterest, tenureMonths) -1)).toFixed(2);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `<h2>Estimated EMI</h2><p>Your monthly EMI is <strong>₹${emi}</strong>.</p>`;
    });
  </script>
</body>
</html>
