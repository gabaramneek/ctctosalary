<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provident Fund (PF) & Gratuity Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>Provident Fund (PF) & Gratuity Calculator</h1>
    <p>Calculate your PF and gratuity contributions based on your salary.</p>
    <form>
      <div class="mb-3">
        <label for="basicSalaryInput" class="form-label">Enter Your Basic Salary (₹):</label>
        <input type="number" class="form-control" id="basicSalaryInput" placeholder="e.g. 50000" required />
      </div>
      <div class="mb-3">
        <label for="yearsInput" class="form-label">Number of Years of Service:</label>
        <input type="number" class="form-control" id="yearsInput" placeholder="e.g. 10" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const basicSalary = parseFloat(document.getElementById('basicSalaryInput').value);
      const years = parseInt(document.getElementById('yearsInput').value);
      if (isNaN(basicSalary) || basicSalary <= 0 || isNaN(years) || years <= 0) {
        alert('Please enter valid positive numbers for salary and years of service.');
        return;
      }
      const pfContribution = (basicSalary * 0.12 * years).toFixed(2);
      const gratuity = (basicSalary * 15 / 26 * years).toFixed(2); // 15 days wages per year approx
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>PF and Gratuity Summary</h2>
        <table class="table table-bordered table-striped">
          <tbody>
            <tr><th>Total PF Contribution</th><td>₹${pfContribution}</td></tr>
            <tr><th>Estimated Gratuity</th><td>₹${gratuity}</td></tr>
          </tbody>
        </table>
      `;
    });
  </script>
</body>
</html>
