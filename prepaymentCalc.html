<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Prepayment Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <style>nav.nav-tabs { position: relative; }</style>
</head>
<body>
  <nav class="nav nav-tabs mb-4">
    <div class="logo-container">
      <a href="index.html"><img src="logo.png" alt="Site Logo" /></a>
    </div>
    <a class="nav-link" href="salaryEmployee.html">Salary Employee</a>
    <a class="nav-link" href="salaryEmployer.html">Salary Employer</a>
    <a class="nav-link" href="taxCalc.html">Income Tax</a>
    <a class="nav-link" href="pfCalc.html">PF / Gratuity</a>
    <a class="nav-link" href="hraCalc.html">HRA Exemption</a>
    <a class="nav-link" href="pension.html">Pension</a>
    <a class="nav-link" href="emiCalc.html">EMI Calculator</a>
    <a class="nav-link" href="prepaymentCalc.html">Prepayment Calculator</a>
  </nav>
  <div class="container">
    <h1>Loan Prepayment Calculator</h1>
    <p>Calculate savings and tenure reduction by prepaying your loan.</p>
    <form>
      <div class="mb-3">
        <label for="outstandingPrincipalInput" class="form-label">Outstanding Principal (₹):</label>
        <input type="number" class="form-control" id="outstandingPrincipalInput" placeholder="e.g. 500000" required />
      </div>
      <div class="mb-3">
        <label for="interestRateInput" class="form-label">Annual Interest Rate (%):</label>
        <input type="number" step="0.01" class="form-control" id="interestRateInput" placeholder="e.g. 8.5" required />
      </div>
      <div class="mb-3">
        <label for="remainingTenureInput" class="form-label">Remaining Tenure (Months):</label>
        <input type="number" class="form-control" id="remainingTenureInput" placeholder="e.g. 60" required />
      </div>
      <div class="mb-3">
        <label for="prepaymentAmountInput" class="form-label">Prepayment Amount (₹):</label>
        <input type="number" class="form-control" id="prepaymentAmountInput" placeholder="e.g. 100000" required />
      </div>
      <button type="submit" class="btn btn-primary">Calculate Savings</button>
    </form>
    <hr />
    <div id="result" class="mt-4"></div>
  </div>
  <script>
    function calculateEmi(principal, annualInterestRate, months) {
      const monthlyInterestRate = annualInterestRate / 12 / 100;
      return (principal * monthlyInterestRate * Math.pow(1 + monthlyInterestRate, months)) /
             (Math.pow(1 + monthlyInterestRate, months) - 1);
    }

    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const principal = parseFloat(document.getElementById('outstandingPrincipalInput').value);
      const interestRate = parseFloat(document.getElementById('interestRateInput').value);
      const tenure = parseInt(document.getElementById('remainingTenureInput').value);
      const prepayment = parseFloat(document.getElementById('prepaymentAmountInput').value);

      if ([principal, interestRate, tenure, prepayment].some(v => isNaN(v) || v <= 0)) {
        alert('Please enter valid positive numbers in all fields.');
        return;
      }
      if (prepayment >= principal) {
        alert('Prepayment amount must be less than outstanding principal.');
        return;
      }

      // EMI before prepayment
      const emiBefore = calculateEmi(principal, interestRate, tenure);
      // New principal after prepayment
      const newPrincipal = principal - prepayment;

      // Calculate new tenure by iteration (approximate)
      let remainingPrincipal = newPrincipal;
      let monthCount = 0;
      while (remainingPrincipal > 0) {
        const interestForMonth = remainingPrincipal * (interestRate / 12 / 100);
        const principalComponent = emiBefore - interestForMonth;
        remainingPrincipal -= principalComponent;
        monthCount++;
        if (monthCount > tenure) break; // prevent infinite loop
      }

      const monthsSaved = tenure - monthCount;
      const totalPaymentBefore = emiBefore * tenure;
      const totalPaymentAfter = emiBefore * monthCount;
      const savings = totalPaymentBefore - totalPaymentAfter;

      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>Prepayment Savings</h2>
        <p>EMI before prepayment: ₹${emiBefore.toFixed(2)}</p>
        <p>New loan tenure after prepayment: <strong>${monthCount}</strong> months</p>
        <p>Months saved: <strong>${monthsSaved}</strong></p>
        <p>Total interest saved: <strong>₹${savings.toFixed(2)}</strong></p>
      `;
    });
  </script>
</body>
</html>
